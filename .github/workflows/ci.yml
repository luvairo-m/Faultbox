name: Python CI

on: pull_request

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install Faultbox and dev tools
        run: python -m pip install ".[dev]"

      - name: Run tests
        run: python -m pytest

      - name: Check types
        run: python -m mypy
