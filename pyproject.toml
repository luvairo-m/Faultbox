[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "faultbox"
version = "0.1.0"
description = "A local simulator for external HTTP APIs using TOML scenarios."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]

[project.scripts]
faultbox = "faultbox.cli:main"

[project.optional-dependencies]
dev = [
    "mypy",
    "pytest",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "--strict-config --strict-markers"

[tool.mypy]
files = ["src"]
python_version = "3.11"
strict = true
